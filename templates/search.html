<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>題庫搜尋</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            background-color: #f4f7f6;
            color: #333;
        }

        .controls {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .controls input[type="text"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
            width: 250px;
        }

        .controls button {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .controls button:hover {
            background-color: #ddd;
        }

        .results {
            max-width: 800px;
            margin: 0 auto;
        }

        .question-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .question-card h3 {
            margin-top: 0;
        }

        mark {
            background-color: yellow;
            font-weight: bold;
        }

        #back-to-select {
            margin-top: 30px;
            text-align: center;
        }

        #back-to-select a {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        #back-to-select a:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>
    <h1 style="text-align:center;">題庫搜尋</h1>
    <div class="controls">
        <label for="keyword">關鍵字：</label>
        <input type="text" id="keyword" placeholder="輸入關鍵字" onkeydown="if(event.key==='Enter') search()">
        <button onclick="search()">搜尋</button>
    </div>

    <div class="results" id="results"></div>

    <script>
        function appendHighlightedText(element, value, keyword) {
            const text = String(value ?? "");
            if (!keyword) {
                element.appendChild(document.createTextNode(text));
                return;
            }
            let pattern;
            try {
                const source = keyword.startsWith("r/")
                    ? keyword.slice(2)
                    : keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                pattern = new RegExp(source, "gi");
            } catch (_error) {
                element.appendChild(document.createTextNode(text));
                return;
            }
            let offset = 0;
            for (const match of text.matchAll(pattern)) {
                if (!match[0]) continue;
                element.appendChild(document.createTextNode(text.slice(offset, match.index)));
                const mark = document.createElement("mark");
                mark.textContent = match[0];
                element.appendChild(mark);
                offset = match.index + match[0].length;
            }
            element.appendChild(document.createTextNode(text.slice(offset)));
        }

        async function search() {
            const keyword = document.getElementById("keyword").value.trim();
            // if (!keyword) return;

            const res = await fetch(`/search_questions?keyword=${encodeURIComponent(keyword)}`);
            const data = await res.json();

            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";

            if (!res.ok) {
                resultsDiv.textContent = data.error || "搜尋失敗";
                return;
            }
            const summary = document.createElement("p");
            summary.textContent = `搜尋結果 (${data.length} 筆)`;
            resultsDiv.appendChild(summary);


            if (data.length === 0) {
                resultsDiv.textContent = "❌ 沒有找到符合的題目";
                return;
            }

            data.forEach(q => {
                const card = document.createElement("div");
                card.className = "question-card";
                const title = document.createElement("h3");
                appendHighlightedText(title, `題號：${q.題號}`, keyword);
                const body = document.createElement("p");
                appendHighlightedText(body, q.題目, keyword);
                const options = document.createElement("ul");
                q.選項.forEach(text => {
                    const option = document.createElement("li");
                    appendHighlightedText(option, text, keyword);
                    options.appendChild(option);
                });
                const answer = document.createElement("p");
                appendHighlightedText(answer, `答案：${q.答案}`, keyword);
                card.append(title, body);
                if (q.圖片 && /^data:image\/(png|jpeg|gif|webp);base64,/.test(q.圖片)) {
                    const image = document.createElement("img");
                    image.src = q.圖片;
                    image.alt = "題目圖片";
                    image.style.maxWidth = "100%";
                    card.appendChild(image);
                }
                card.append(options, answer);
                resultsDiv.appendChild(card);
            });
        }
    </script>
</body>

</html>
