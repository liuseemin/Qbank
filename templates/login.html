<!doctype html>
<html lang="zh-Hant"><head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登入 Qbank</title>
    <style>
        body{background:#f4f7f6;font-family:system-ui,sans-serif}.card{max-width:520px;margin:8vh auto;padding:32px;background:white;border-radius:12px;box-shadow:0 4px 16px #0002}
        .group{margin:18px 0}label{display:block;margin-bottom:7px;font-weight:600}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bbb;border-radius:8px;background:white}
        .hint{color:#667;font-size:.92rem}.error{color:#b42318}button{padding:11px 24px;border:0;border-radius:8px;color:white;background:#2878bd;cursor:pointer}
    </style>
</head><body><main class="card">
    <h1>Qbank 題庫練習</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        {% if password_required %}<div class="group"><label for="password">網站密碼</label><input type="password" id="password" name="password" required autocomplete="current-password"></div>{% endif %}
        <div class="group"><label for="ai_provider">AI 詳解來源</label><select id="ai_provider" name="ai_provider">
            <option value="none">不使用 AI 詳解</option><option value="gemini">Google Gemini</option>
            <option value="openai">OpenAI</option><option value="anthropic">Anthropic Claude</option>
            <option value="ollama">Ollama / OpenAI-compatible</option>
        </select></div>
        <div id="ai-settings" hidden>
            <div class="group"><label for="ai_model">模型名稱</label><input id="ai_model" name="ai_model" autocomplete="off" placeholder="例如 gpt-5、claude-sonnet-4-6"></div>
            <div class="group"><label for="api_key">API Key</label><input type="password" id="api_key" name="api_key" autocomplete="off"><p class="hint">Ollama 可留白；其他來源必填。Key 只存於伺服器端 SQLite，不會寫入瀏覽器 cookie。</p></div>
            <div class="group"><label for="ai_base_url">API Base URL（選填）</label><input type="url" id="ai_base_url" name="ai_base_url" autocomplete="off" placeholder="使用官方預設端點"><p class="hint">本機 Ollama 預設為 http://127.0.0.1:11434/v1；Render 無法直接存取您電腦的 localhost。</p></div>
        </div>
        <p class="hint">無 AI 模式會隱藏詳解欄並將答題視窗置中。</p>
        <button type="submit">繼續</button>
    </form>
</main><script>
const provider = document.getElementById('ai_provider');
const settings = document.getElementById('ai-settings');
const model = document.getElementById('ai_model');
const endpoint = document.getElementById('ai_base_url');
const defaults = {gemini:'gemini-2.5-flash',openai:'gpt-5',anthropic:'claude-sonnet-4-6',ollama:'gpt-oss:20b'};
function updateAISettings(){
    settings.hidden = provider.value === 'none';
    if (!model.value || Object.values(defaults).includes(model.value)) model.value = defaults[provider.value] || '';
    if (provider.value === 'ollama' && !endpoint.value) endpoint.placeholder = 'http://127.0.0.1:11434/v1';
    else endpoint.placeholder = '使用官方預設端點';
}
provider.addEventListener('change', updateAISettings); updateAISettings();
</script></body></html>
