services:
  - type: web
    name: qbank
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: qbank-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_SECRET_KEY
        generateValue: true
      - key: RENDER_DISK_PATH
        value: /var/data
      - key: MAX_UPLOAD_MB
        value: 25
